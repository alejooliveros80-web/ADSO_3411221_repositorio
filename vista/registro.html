<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de asociados | Club Acerías</title>
    <link rel="stylesheet" href="../assets/css/formularios.css">
</head>

<body class="form-page">
    <header class="site-header">
        <div class="header-inner">
            <p class="brand">CLUB ACERÍAS</p>
            <nav class="form-nav" aria-label="Formularios del sistema">
                <a href="registro.html" aria-current="page">Asociados</a>
                <a href="registro_actividades.html">Actividades</a>
                <a href="registro_pago.html">Pagos</a>
                <a href="registro_prestamos.html">Préstamos</a>
                <a href="dashboard.html">Panel</a>
            </nav>
        </div>
    </header>
    <main class="page-content">
        <div class="page-heading">
            <h1>Registro de asociados</h1>
            <p>Ingresa la información personal y de contacto del asociado.</p>
        </div>
        <section class="form-card">
            <form id="FormRegistro" action="../modelo/guardarAsociados.php" method="POST">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="documento">Documento</label>
                        <input type="text" id="documento" name="documento" required placeholder="Ej. 1938392928">
                    </div>
                    <div class="form-field">
                        <label for="fechaNacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                    </div>
                    <div class="form-field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Nombre(s)">
                    </div>
                    <div class="form-field">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" required placeholder="Apellido(s)">
                    </div>
                    <div class="form-field full-width">
                        <span class="form-label">Género</span>
                        <div class="radio-options">
                            <label><input type="radio" name="genero" value="Masculino"> Masculino</label>
                            <label><input type="radio" name="genero" value="Femenino"> Femenino</label>
                            <label><input type="radio" name="genero" value="otro"> Otro</label>
                        </div>
                    </div>
                    <div class="form-field full-width">
                        <label for="direccion">Dirección de residencia</label>
                        <input type="text" id="direccion" name="direccion" required placeholder="Dirección">
                    </div>
                    <div class="form-field">
                        <label for="ciudad">Ciudad</label>
                        <select id="ciudad" name="ciudad" required>
                            <option value="">Selecciona una ciudad</option>
                            <option>Sogamoso</option>
                            <option>Duitama</option>
                            <option>Cerinza</option>
                            <option>Otra</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 3151234567">
                    </div>
                    <div class="form-field full-width">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" required placeholder="nombre@correo.com">
                    </div>

                    <div class="form-field">
                        <label for="panswoard">Contraseña</label>
                        <input type="password" id="panswoard" name="panswoard" required minlength="8"
                            placeholder="Ingresa tu contraseña">
                    </div>

                    <div class="form-field">
                        <label for="confirmarPanswoard">Confirmar contraseña</label>
                        <input type="password" id="confirmarPanswoard" name="confirmarPanswoard" required minlength="8"
                            placeholder="Confirma tu contraseña">
                    </div>

                    <div class="form-actions">
                        <button class="button-secondary" type="reset">Limpiar</button>
                        <button class="button-primary" type="submit">Guardar asociado</button>
                    </div>
                    <p id="mensaje_registro" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="../controlador/asociados.js"></script>
</body>

</html>
