<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de pago | Club Acerías</title>
    <link rel="stylesheet" href="../assets/css/formularios.css">
</head>

<body class="form-page">
    <header class="site-header">
        <div class="header-inner">
            <p class="brand">CLUB ACERÍAS</p>
            <nav class="form-nav" aria-label="Formularios del sistema">
                <a href="registro.html">Asociados</a>
                <a href="actividades.html">Actividades</a>
                <a href="registro_pago.html" aria-current="page">Pagos</a>
                <a href="registro_prestamos.html">Préstamos</a>
                <a href="dashboard.html">Panel</a>
            </nav>
        </div>
    </header>
    <main class="page-content">
        <div class="page-heading">
            <h1>Registro de pago</h1>
            <p>Registra el pago realizado y asócialo con un miembro del club.</p>
        </div>
        <section class="form-card">
            <form id="formularioPago">
                <div class="form-grid">
                    <!-- Identifica al asociado al que pertenece el préstamo. -->
                    <div class="form-field">
                        <label for="documentoAsociado">Documento del asociado</label>
                        <input type="text" id="documentoAsociado" name="documentoAsociado" required
                            placeholder="Número de documento">
                    </div>

                    <!-- Indica a cuál de los préstamos del asociado se aplica el pago. -->
                    <div class="form-field">
                        <label for="idPrestamo">ID del préstamo</label>
                        <input type="number" id="idPrestamo" name="idPrestamo" min="1" step="1" required
                            placeholder="ID del préstamo">
                    </div>

                    <!-- Guarda la fecha en que se recibió el pago. -->
                    <div class="form-field">
                        <label for="fechaPago">Fecha del pago</label>
                        <input type="date" id="fechaPago" name="fechaPago" required>
                    </div>

                    <!-- Guarda el valor pagado por el asociado. -->
                    <div class="form-field">
                        <label for="valorCuota">Valor pagado</label>
                        <input type="number" id="valorCuota" name="valorCuota" min="0.01" step="0.01" required
                            placeholder="$ 0.00">
                    </div>
                </div>

                <div class="form-actions">
                    <button class="button-secondary" type="reset">Limpiar</button>
                    <button class="button-primary" type="submit">Guardar pago</button>
                </div>

                <p id="mensajePago" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="../controlador/pagos.js"></script>
</body>

</html>
