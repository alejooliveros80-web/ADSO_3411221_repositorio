<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de actividades | Club Acerías</title>
    <link rel="stylesheet" href="../assets/css/formularios.css">
</head>
<body class="form-page">
    <header class="site-header">
        <div class="header-inner">
            <p class="brand">CLUB ACERÍAS</p>
            <nav class="form-nav" aria-label="Formularios del sistema">
                <a href="registro.html">Asociados</a>
                <a href="actividades.html">Actividades</a>
                <a href="registro_pago.html">Pagos</a>
                <a href="registro_prestamos.html">Préstamos</a>
                <a href="dashboard.html">Panel</a>
            </nav>
        </div>
    </header>
    <main class="page-content">
        <div class="page-heading">
            <h1>Registro de actividades</h1>
            <p>Agrega una actividad a la tabla del club.</p>
        </div>
        <section class="form-card">
            <!-- Formulario para capturar los datos de una actividad nueva. -->
            <form id="formularioActividad" action="../modelo/guardarActividad.php" method="post">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="nombreActividad">Nombre de la actividad</label>
                        <input type="text" id="nombreActividad" name="nombreActividad" required placeholder="Ej. Asamblea general">
                    </div>
                    <div class="form-field">
                        <label for="fechaEvento">Fecha del evento</label>
                        <input type="date" id="fechaEvento" name="fechaEvento" required>
                    </div>
                    <div class="form-field">
                        <label for="municipio">Municipio</label>
                        <input type="text" id="municipio" name="municipio" maxlength="50" required placeholder="Ej. Duitama">
                    </div>
                    <div class="form-field">
                        <label for="totalRecaudado">Total recaudado</label>
                        <input type="number" id="totalRecaudado" name="totalRecaudado" min="0" step="0.01" value="0.00" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="button-secondary" type="reset">Limpiar</button>
                    <button class="button-primary" type="submit">Guardar actividad</button>
                </div>
                <!-- Muestra el resultado que devuelve el servidor PHP. -->
                <p id="mensajeActividad" class="form-hint" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <!-- Envía el formulario al servidor y carga las actividades desde MySQL. -->
    <script src="../controlador/actividades.js"></script>
</body>
</html>
