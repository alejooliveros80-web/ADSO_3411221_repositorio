<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de préstamos | Club Acerías</title>
    <link rel="stylesheet" href="../assets/css/formularios.css">
</head>

<body class="form-page">
    <header class="site-header">
        <div class="header-inner">
            <p class="brand">CLUB ACERÍAS</p>
            <nav class="form-nav" aria-label="Formularios del sistema">
                <a href="registro.html">Asociados</a>
                <a href="actividades.html">Actividades</a>
                <a href="registro_pago.html">Pagos</a>
                <a href="registro_prestamos.html" aria-current="page">Préstamos</a>
                <a href="dashboard.html">Panel</a>
            </nav>
        </div>
    </header>
    <main class="page-content">
        <div class="page-heading">
            <h1>Solicitar préstamo</h1>
            <p>Ingresa la información inicial de la solicitud de préstamo.</p>
        </div>
        <section class="form-card">
            <form id="formularioPrestamo">
                <div class="form-grid">
                    <!-- Fecha en que el asociado solicita el préstamo. -->
                    <div class="form-field">
                        <label for="fechaSolicitud">Fecha de solicitud</label>
                        <input type="date" id="fechaSolicitud" name="fechaSolicitud" required>
                    </div>

                    <!-- Valor que el asociado solicita. -->
                    <div class="form-field">
                        <label for="monto">Monto solicitado</label>
                        <input type="number" id="monto" name="monto" min="1" step="1000" required placeholder="$ 0">
                    </div>

                    <!-- Plazo solicitado para pagar. -->
                    <div class="form-field">
                        <label for="plazo">Plazo de pago (meses)</label>
                        <input type="number" id="plazo" name="plazo" min="1" step="1" required placeholder="Ej. 12">
                    </div>

                    <!-- Tasa solicitada; el administrador revisará la solicitud. -->
                    <div class="form-field">
                        <label for="tasa">Tasa de interés solicitada (%)</label>
                        <input type="number" id="tasa" name="tasa" min="0" step="0.01" required
                            placeholder="Según política del club">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="button-secondary" type="reset">Limpiar</button>
                    <button class="button-primary" type="submit">Enviar solicitud</button>
                </div>
                <!-- Aquí se muestran confirmaciones o errores al guardar el préstamo. -->
                <p id="mensajePrestamo" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <!-- Carga el controlador del formulario de préstamos. -->
    <script src="../controlador/prestamos.js"></script>
</body>

</html>
